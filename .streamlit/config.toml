# Nord theme for the Deepgram Medical Transcription UI.
# Arctic, north-bluish palette (Polar Night / Snow Storm / Frost / Aurora).
#
# SINGLE MODE, BY DESIGN. Only [theme] is defined — no [theme.light] / [theme.dark].
# Streamlit exposes the Light/Dark/System switcher in the Settings menu *only* when
# both mode tables exist, so one table locks the app to this palette and removes the
# toggle. Adding either mode table back would restore the switcher.
#
# Pure configuration — no Python, so it never touches the test suite.
[theme]
base = "dark"

# Core surfaces — Polar Night, layered lightest-on-top for depth.
primaryColor = "#5E81AC"             # nord10 frost: Run button, active tab underline, focus rings
# NOT nord8 #88C0D0, which is Nord's canonical accent. `primaryColor` is the background of the
# type="primary" Run submit button, and Streamlit hardcodes that label white — there is no
# `primaryTextColor` among the 277 theme options. Measured in-browser: white on #88C0D0 is
# 2.00:1 (washed out); on nord10 it is 4.03:1. Same Frost family, readable button.
backgroundColor = "#2E3440"          # nord0 main canvas
secondaryBackgroundColor = "#3B4252" # nord1 widget / container backgrounds
codeBackgroundColor = "#3B4252"      # nord1 — JSON tab blocks match the widget surface
textColor = "#ECEFF4"                # nord6 snow storm body text (~13:1 on nord0)
codeTextColor = "#D8DEE9"            # nord4 — code sits a step quieter than body text
linkColor = "#81A1C1"                # nord9 frost
borderColor = "#4C566A"              # nord3 widget borders

# Shape — Nord's convention is a tighter radius than Streamlit's default.
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = true             # divider between the Features sidebar and the output area
linkUnderline = false                # color alone signals links — cleaner than underlines

# Typography — Inter (UI) and JetBrains Mono (JSON/code view), SELF-HOSTED from
# static/ (see the [[theme.fontFaces]] tables below + [server].enableStaticServing).
# The upstream Nord template loads these two families from Google Fonts; that is
# deliberately NOT used here — no request ever leaves the app to a third-party font
# CDN, which matters for a PHI app. Streamlit falls back to the system sans / mono
# stack if a face fails to load.
font = "Inter"
codeFont = "'JetBrains Mono'"
codeFontSize = "0.875rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

# Semantic palette — Frost + Aurora. These back the diarized speaker-label
# highlights (`:{color}-background[**Speaker N:**]` from _SPEAKER_COLORS, which is
# ("blue", "green", "violet", "orange", "red", "gray")) and the status accents.
# All six names must stay defined or a speaker line falls back to Streamlit's default.
blueColor = "#81A1C1"                # nord9  — Speaker 1
greenColor = "#A3BE8C"               # nord14 — Speaker 2 / success accents
violetColor = "#B48EAD"              # nord15 — Speaker 3
orangeColor = "#D08770"              # nord12 — Speaker 4
redColor = "#BF616A"                 # nord11 — Speaker 5 / error accents (st.error)
grayColor = "#D8DEE9"                # nord4  — Speaker 6 / unlabeled-speaker fallback
yellowColor = "#EBCB8B"              # nord13 — warning accents (st.warning)

# Unused today (the app renders no charts), kept so st.metric sparklines and any
# future chart inherit the Nord ramp instead of Streamlit's stock categorical colors.
chartCategoricalColors = ["#88C0D0", "#81A1C1", "#5E81AC", "#A3BE8C", "#EBCB8B", "#D08770", "#BF616A"]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-400.woff2"
weight = 400
[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-500.woff2"
weight = 500
[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-600.woff2"
weight = 600
[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-700.woff2"
weight = 700
[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/jetbrains-mono-400.woff2"
weight = 400
[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/jetbrains-mono-500.woff2"
weight = 500

# Sidebar (the Features form) — one Polar Night step lighter than the main canvas,
# so app-level settings read as a distinct surface from the transcript output.
[theme.sidebar]
backgroundColor = "#3B4252"          # nord1
secondaryBackgroundColor = "#434C5E" # nord2 — widgets inside the sidebar
codeBackgroundColor = "#434C5E"      # nord2
borderColor = "#4C566A"              # nord3

# Serve the bundled fonts under static/ at app/static/* (referenced by the
# [[theme.fontFaces]] URLs above). Keeps typography first-party — no font CDN.
[server]
enableStaticServing = true
# Effective per-file upload cap (MB). Streamlit defaults to 200 and silently caps
# uploads there, so a larger app-side limit would be unreachable; pin it
# explicitly and keep it in sync with nova.config.MAX_FILE_SIZE.
maxUploadSize = 200

# Opt out of Streamlit's anonymous usage telemetry, which DEFAULTS TO TRUE and
# posts to a third-party endpoint (webhooks.fivetran.com) on every session —
# observed as 5 requests per page load before this was set. It carries usage
# metrics, not transcript content, but this app's PHI policy is "assume every
# request/response carries PHI", and an unaudited third-party beacon from a
# clinical-transcription page is not worth defending. With this false, the only
# traffic the app originates is the Deepgram API call itself.
[browser]
gatherUsageStats = false
