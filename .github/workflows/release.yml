name: release

# Cut a release by bumping `[project].version` in pyproject.toml and landing it on
# main. This workflow reads the declared version, gates on the four project gates,
# creates the matching vX.Y.Z tag, and publishes the GitHub Release.
#
# WHY ONE WORKFLOW AND NOT TWO. The obvious split — "workflow A pushes the tag,
# workflow B fires on that tag push and publishes" — cannot work with the default
# GITHUB_TOKEN: GitHub does not start a workflow run from a ref created by that
# token (the recursive-workflow guard), and the guard is keyed on the TOKEN, not
# the transport, so `POST /git/refs` is suppressed exactly as a `git push` is.
# Workflow B would simply never fire, silently. Every workaround (PAT, App token,
# deploy key) means minting a long-lived write credential for a repo that today
# holds no secrets at all. Doing both halves in one run needs no second identity,
# and the guard then works FOR us: the tag this run creates cannot start a second
# run, so the `v*` escape hatch below can never double-release.
#
# Same rule, forward-looking: the `release: published` event this run emits will
# NOT trigger an `on: release` workflow either. Anything that must happen on a
# release belongs in the `release` job below, as another step.
on:
  push:
    branches: [main]
    # Escape hatch, kept from the hand-tagged flow this replaces. A tag pushed by
    # a HUMAN uses their credential, so it is a real push event and does start
    # this workflow; the tag this run creates is not. It is the only way to cut a
    # release from a commit that is not main's HEAD.
    tags: ["v*"]
    # Deliberately NO `paths:` filter. It would gate the tag escape hatch too, and
    # it would make the detector edge-triggered: this workflow asks "is the
    # declared version tagged yet?", never "did this push change it?", which is
    # what lets an evicted or half-dead run heal itself on the next push.
  # Re-run resolution without pushing (e.g. after clearing a stale draft). Takes
  # no inputs, so there is no `inputs.*` to interpolate anywhere.
  workflow_dispatch:

# Read-only by default. Exactly one job below elevates, and only to `contents`.
permissions:
  contents: read

# One release at a time, never aborted mid-publish. A constant group (not
# `github.ref`) so a main push and a hand-pushed tag serialize instead of racing.
# It does not collide with the gate: ci.yml's own group interpolates
# `github.workflow`-`github.ref`, which resolves to `release-refs/heads/main`.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      release: ${{ steps.target.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here writes over git — the tag is created through the REST
          # API — so no credential belongs in .git/config.
          persist-credentials: false

      - name: Read the version and check whether it is already tagged
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        # Parse with stdlib `tomllib` on the runner's preinstalled Python, the way
        # tests/test_license.py reads the same file. A grep would be wrong:
        # `version` appears under other tables and `requires-python` is close
        # enough to catch a careless pattern.
        #
        # The strict `[0-9]` check is load-bearing twice: the value becomes a git
        # ref AND is written to $GITHUB_OUTPUT, where an embedded newline is the
        # classic step-output injection vector. `re.fullmatch` is used because a
        # `$`-anchored regex accepts a trailing newline; `[0-9]` because Python's
        # `\d` also matches non-ASCII digits. A `dynamic = ["version"]` project
        # has no static `version` key, so it fails here rather than drifting.
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import pathlib, re, tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data.get("project", {}).get("version", "")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"[project].version must be a static, plain X.Y.Z; got {version!r}")
          print(version)
          PY
          )"
          tag="v$version"

          # On the tag escape hatch, refuse a tag that disagrees with the version
          # declared at that commit, so a hand-pushed v0.9.0 on a 0.8.1 tree stops
          # here instead of publishing a Release that lies.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::pushed tag $GITHUB_REF_NAME does not match [project].version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # THE detector, and it is deliberately not "did this push change the
          # version". `GET /git/ref/{ref}` is the EXACT-match endpoint (404 when
          # absent; the older plural `git/refs/` prefix-matches, so v0.1 would
          # "find" v0.10.0). Only a 200 means released, so a transient API error
          # degrades to "attempt the create" — safe, because that create is atomic.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists — nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$tag is new — gating on CI, then tagging and publishing." >> "$GITHUB_STEP_SUMMARY"
          fi

  gate:
    # No tag is minted for a commit whose gates are red. This calls ci.yml as a
    # local reusable workflow rather than polling the `checks (3.12)` /
    # `checks (3.13)` check runs: no `checks: read` scope, no race against a CI
    # run that started in the same instant, and no hard-coding of the branch
    # protection check NAMES into a second place. `./` is this repo's own file at
    # this commit — nothing third-party, nothing to SHA-pin.
    #
    # This is not belt-and-braces: the `main` ruleset requires those two checks
    # but does NOT require a pull request, and it carries an always-bypass actor.
    # A direct push to main is possible, so this gate is the only thing standing
    # between a red commit and a published Release.
    #
    # It runs only when `release == 'true'`, so an ordinary push to main pays for
    # resolve alone and CI is not run twice.
    name: Gate on CI
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Tag and publish
    needs: [resolve, gate]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only write scope in the file, on the only job that needs it. Creating a
    # git ref and creating a Release are both governed by `contents` — GitHub has
    # no narrower `tags:`/`releases:` scope. Pointedly NO `pull-requests`: this
    # workflow opens no PRs, so it can never hit the "GitHub Actions is not
    # permitted to create or approve pull requests" repo/org policy.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Create the tag
        # Idempotency is enforced by the API, not by the earlier probe: creating
        # `refs/tags/$TAG` is atomic and a second attempt returns 422. So
        # `create || confirm-it-exists-now` can neither double-tag nor be raced,
        # and — unlike grepping GitHub's error text — it does not rot when that
        # wording changes. A create that fails for any other reason (403 from a
        # tag ruleset) leaves the ref absent, fails the confirm, and goes red.
        #
        # A lightweight tag is deliberate: nothing here runs `git describe` and
        # the version is static, so an annotated tag would cost an extra API call
        # and buy nothing. There is no PATCH anywhere — this can create a tag,
        # never move one.
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null \
            || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null
          echo "Tagged $GITHUB_SHA as $TAG."

      - name: Publish the GitHub Release
        # `--json isDraft` rather than a bare existence check: `gh release view`
        # exits 0 for a draft too, so treating a draft as "done" would leave a
        # Release that is never published and that every later run reports as
        # already done. This job creates no drafts, so a draft here is someone's
        # work in progress and the step refuses rather than stomping it.
        #
        # Drafting and publishing are ONE step. `--draft` buys a private staging
        # area while artifacts upload and a human edit pass on the notes; this
        # repo attaches no artifacts and generates notes from merged PRs, so a
        # draft would only add a third partial state. If wheels are ever attached,
        # split into `gh release create --draft` -> upload -> `gh release edit
        # --draft=false`, and the isDraft check below becomes the resume point.
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              echo "::error::$TAG already has a DRAFT release — publish or delete it, then re-run."
              exit 1
            fi
            echo "Release $TAG is already published — nothing to do."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
